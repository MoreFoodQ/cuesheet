<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="CueSheet: who has quota takes the cue">
  <title>CueSheet</title>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
  </defs>

  <!-- 背景紙 -->
  <rect x="10" y="10" width="1180" height="360" rx="30" fill="#FBF6EC" filter="url(#rough2)"/>
  <rect x="10" y="10" width="1180" height="360" rx="30" fill="none" stroke="#221C16" stroke-width="5" filter="url(#rough)"/>

  <!-- 圖示（同 logo.svg） -->
  <g transform="translate(40 30) scale(0.62)">
    <g transform="rotate(-3 256 256)">
      <rect x="44" y="52" width="424" height="408" rx="26" fill="#F5ECDC" filter="url(#rough)"/>
      <rect x="44" y="52" width="424" height="408" rx="26" fill="none" stroke="#221C16" stroke-width="7" filter="url(#rough)"/>
      <rect x="48" y="57" width="420" height="402" rx="28" fill="none" stroke="#221C16" stroke-width="2.5" opacity=".55" filter="url(#rough2)"/>
    </g>
    <g stroke-linecap="round" filter="url(#rough2)">
      <line x1="138" y1="210" x2="292" y2="210" stroke="#221C16" stroke-width="4" opacity=".35"/>
      <line x1="138" y1="256" x2="292" y2="256" stroke="#221C16" stroke-width="4" opacity=".35"/>
      <line x1="138" y1="302" x2="292" y2="302" stroke="#221C16" stroke-width="4" opacity=".35"/>
      <line x1="140" y1="210" x2="272" y2="210" stroke="#3E9A62" stroke-width="20"/>
      <line x1="140" y1="256" x2="214" y2="256" stroke="#E4A33A" stroke-width="20"/>
      <line x1="140" y1="302" x2="160" y2="302" stroke="#D4503F" stroke-width="20"/>
    </g>
    <g fill="none" stroke="#221C16" stroke-linecap="round">
      <circle cx="215" cy="256" r="120" stroke-width="22" filter="url(#rough)"/>
      <circle cx="219" cy="252" r="126" stroke-width="5" opacity=".5" filter="url(#rough2)"/>
    </g>
    <g stroke-linecap="round" filter="url(#rough)">
      <line x1="276" y1="300" x2="436" y2="430" stroke="#221C16" stroke-width="9"/>
      <line x1="270" y1="294" x2="300" y2="319" stroke="#221C16" stroke-width="26"/>
      <line x1="268" y1="292" x2="296" y2="315" stroke="#B9824A" stroke-width="16"/>
    </g>
    <g stroke="#E4A33A" stroke-width="9" stroke-linecap="round" filter="url(#rough2)">
      <line x1="392" y1="104" x2="392" y2="150"/>
      <line x1="369" y1="127" x2="415" y2="127"/>
      <line x1="376" y1="111" x2="408" y2="143"/>
      <line x1="408" y1="111" x2="376" y2="143"/>
    </g>
  </g>

  <!-- 字標 -->
  <g filter="url(#soft)" fill="#221C16">
    <text x="400" y="185" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="112" font-weight="700" letter-spacing="2">CueSheet</text>
  </g>
  <path d="M 404 212 C 560 200, 760 214, 940 204" fill="none" stroke="#E4A33A" stroke-width="9" stroke-linecap="round" filter="url(#rough2)"/>
  <g transform="rotate(-2 520 272)">
    <rect x="398" y="226" width="236" height="66" rx="10" fill="#221C16" filter="url(#rough2)"/>
    <text x="414" y="276" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="46" font-weight="900" fill="#FBF6EC" letter-spacing="6">你行你上</text>
  </g>
  <text x="656" y="276" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="34" font-weight="700" fill="#D4503F" filter="url(#soft)">Got quota? You're on.</text>
  <text x="406" y="334" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#6B5D4F" letter-spacing="1">Claude Code · Codex · Gemini</text>
</svg>
